name: CI

# No `push: main` trigger. The `CI` ruleset on main requires the aggregate `CI`
# check with `strict_required_status_checks_policy: true`, so a PR cannot merge
# unless its head is already up to date with main and that exact tree passed the
# full suite. Re-running everything on the merge commit tested nothing new.
"on":
  pull_request:
  merge_group:
  workflow_dispatch:

# One run per PR head. A superseded push (including a Release Please force-push
# that regenerates the release branch) cancels its predecessor. Merge queue runs
# are never cancelled: the queue is already serialising exact merge candidates.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types that release-please changelog-sections recognize, plus chore
          # for release-please PRs (pull-request-title-pattern).
          types: |
            feat
            fix
            perf
            refactor
            revert
            chore
      - name: Skip on non-PR events
        if: github.event_name != 'pull_request'
        run: echo "PR title check not applicable for ${{ github.event_name }}."

  changes:
    name: Changes
    runs-on: ubuntu-latest
    needs: pr-title
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      web: ${{ steps.paths.outputs.web }}
      lockfile: ${{ steps.paths.outputs.lockfile }}
      full: ${{ steps.paths.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed path lanes
        id: paths
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node scripts/ci-changed-paths.mjs

  file-loc:
    name: File LOC
    runs-on: ubuntu-latest
    needs: pr-title
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--main') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed file sizes
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node scripts/check-file-loc.mjs

  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    needs: pr-title
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--main') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify CI and release pipeline invariants
        run: npm run ci:verify

  # The generated Release Please PR contains no source changes: every commit it
  # releases already passed the full suite on its own PR. It gets this one cheap
  # job instead — the checks that are actually specific to a release candidate.
  release-candidate:
    name: Release Candidate
    runs-on: ubuntu-latest
    needs: pr-title
    if: ${{ startsWith(github.head_ref, 'release-please--branches--main') }}

    steps:
      - name: Checkout release PR head
        uses: actions/checkout@v4
        with:
          # The exact head SHA, not the ephemeral pull/N/merge ref, so the job
          # verifies the commit that will be merged.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # GitHub's native mergeability already blocks a conflicted PR, but it
      # reports it as an unexplained "can't merge" banner. This turns the same
      # state into a failing check with the conflicting paths in the log.
      - name: Detect merge conflicts with main
        run: |
          set -uo pipefail
          conflicts=$(git merge-tree --write-tree origin/main HEAD)
          status=$?

          if [ "$status" -eq 0 ]; then
            echo "Release PR merges cleanly into origin/main."
            exit 0
          fi

          if [ "$status" -gt 1 ]; then
            echo "::error title=merge-tree failed::git merge-tree exited $status"
            printf '%s\n' "$conflicts"
            exit "$status"
          fi

          echo "::error title=Release PR conflicts with main::Re-run the Release Please workflow to regenerate this branch from current main."
          printf '%s\n' "$conflicts"
          exit 1

      - name: Check release version consistency
        run: node scripts/check-release-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      # Proves Cargo.lock records the bumped version: `--locked` fails if the
      # lockfile would need to change.
      - name: Cargo check
        run: cargo check --locked -p ajax-cli

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    needs:
      - pr-title
      - changes
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--branches--main') &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.rust == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    needs:
      - pr-title
      - changes
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--branches--main') &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.rust == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Nextest
        run: cargo nextest run --all-features

      - name: Doc tests
        run: cargo test --doc

  rust-docs:
    name: Rust Docs
    runs-on: ubuntu-latest
    needs:
      - pr-title
      - changes
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--branches--main') &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.rust == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    needs:
      - pr-title
      - changes
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--branches--main') &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.lockfile == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: cargo audit

  web-unit:
    name: Web Unit
    runs-on: ubuntu-latest
    needs:
      - pr-title
      - changes
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--branches--main') &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.web == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck web sources
        run: npm run web:check

      - name: Lint web sources
        run: npm run web:lint

      - name: ast-grep web sources
        run: npm run web:sg

      - name: Vitest
        run: npm run web:test -- --run

      - name: Verify committed web dist matches build output
        run: |
          npm run web:build
          git diff --exit-code crates/ajax-web/web/dist

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    needs:
      - pr-title
      - changes
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--branches--main') &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.web == 'true') }}
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    timeout-minutes: 20
    # Container jobs run as root against a runner-owned checkout. checkout's
    # safe.directory lives in a temporary HOME and is invisible once a step
    # sets HOME=/root, so mark the workspace for every git invocation here.
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: End-to-end tests
        env:
          HOME: /root
        run: npm run web:smoke -- --project=mobile-webkit

  # The single required status check. Exactly one of the two paths must be
  # green: the full suite on a normal PR, or release-candidate on a Release
  # Please PR.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - pr-title
      - changes
      - file-loc
      - invariants
      - release-candidate
      - rust-lint
      - rust-test
      - rust-docs
      - audit
      - web-unit
      - web-e2e
    if: ${{ always() }}

    steps:
      - name: Verify required checks
        run: |
          set -euo pipefail

          if [[ "${{ needs.pr-title.result }}" != "success" ]]; then
            echo "PR title check did not pass (${{ needs.pr-title.result }})."
            exit 1
          fi

          if [[ "${{ startsWith(github.head_ref, 'release-please--branches--main') }}" == "true" ]]; then
            if [[ "${{ needs.release-candidate.result }}" != "success" ]]; then
              echo "Release candidate check did not pass (${{ needs.release-candidate.result }})."
              exit 1
            fi
            echo "Release PR: release-candidate passed. The full suite is not re-run because every released commit already passed it on its own PR."
            exit 0
          fi

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Changes detection did not pass (${{ needs.changes.result }})."
            exit 1
          fi

          FULL="${{ needs.changes.outputs.full }}"
          RUST="${{ needs.changes.outputs.rust }}"
          WEB="${{ needs.changes.outputs.web }}"
          LOCKFILE="${{ needs.changes.outputs.lockfile }}"

          if [[ -z "$FULL" || -z "$RUST" || -z "$WEB" || -z "$LOCKFILE" ]]; then
            echo "Changes job did not emit path lane outputs."
            exit 1
          fi

          for result in \
            "${{ needs.file-loc.result }}" \
            "${{ needs.invariants.result }}"
          do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job did not pass (result: $result)."
              exit 1
            fi
          done

          require_lane_jobs() {
            local lane="$1"
            shift
            for result in "$@"; do
              if [[ "$result" != "success" ]]; then
                echo "Required ${lane} lane job did not pass (result: $result)."
                exit 1
              fi
            done
          }

          if [[ "$FULL" == "true" || "$RUST" == "true" ]]; then
            require_lane_jobs "rust" \
              "${{ needs.rust-lint.result }}" \
              "${{ needs.rust-test.result }}" \
              "${{ needs.rust-docs.result }}"
          fi

          if [[ "$FULL" == "true" || "$WEB" == "true" ]]; then
            require_lane_jobs "web" \
              "${{ needs.web-unit.result }}" \
              "${{ needs.web-e2e.result }}"
          fi

          if [[ "$FULL" == "true" || "$LOCKFILE" == "true" ]]; then
            require_lane_jobs "audit" "${{ needs.audit.result }}"
          fi

          echo "All required CI jobs passed."
