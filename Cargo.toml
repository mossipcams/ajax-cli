[workspace]
members = [
    "crates/ajax-cli",
    "crates/ajax-core",
    "crates/ajax-supervisor",
    "crates/ajax-tui",
    "crates/ajax-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mossipcams/ajax-cli"

[workspace.dependencies]
agent-client-protocol = "=2.1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = { version = "0.23", features = ["std"] }
blocking = "1.6"
futures = "0.3"
portable-pty = "0.9"
clap = "4.5"
crossterm = "0.29"
getrandom = "0.4"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
notify = "8"
nix = { version = "0.31", features = ["fs", "poll", "process", "signal", "term"] }
proptest = "1.11.0"
ratatui = { version = "0.30", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
rstest = "0.27.0"
shuttle = "0.9"
rusqlite = "0.40"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1"
tokio-rustls = "0.26"
tower = "0.5"
tower-http = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }
toml = "0.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
