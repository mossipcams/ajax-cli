[package]
name = "ajax-cli"
version = "0.55.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "ajax-cli"
path = "src/main.rs"

[dependencies]
ajax-core = { path = "../ajax-core", version = "0.11.0" }
ajax-supervisor = { path = "../ajax-supervisor", version = "0.11.0" }
ajax-tui = { path = "../ajax-tui", version = "0.11.0" }
ajax-web = { path = "../ajax-web", version = "0.11.0" }
agent-client-protocol = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "time"] }
tracing = { workspace = true }
ratatui = { workspace = true, default-features = false, features = [
    "crossterm",
    "underline-color",
    "layout-cache",
] }
crossterm = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
