[package]
name = "ajax-web"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
agent-client-protocol = { workspace = true, features = ["unstable_elicitation"] }
ajax-core = { path = "../ajax-core", version = "0.11.0" }
axum = { workspace = true }
base64 = { workspace = true }
blocking = { workspace = true }
futures = { workspace = true }
portable-pty = { workspace = true }
getrandom = { workspace = true }
jsonwebtoken = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "net", "time"] }
tokio-rustls = { workspace = true }
tower-http = { workspace = true, features = ["compression-gzip"] }
web-push-native = { version = "0.5.0", default-features = false, features = ["vapid"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
